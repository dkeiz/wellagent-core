# wellagent-core — standalone headless agent (Docker)
#
# Runs the agent backend with no GUI and exposes the control API at :8788.
#
# Quick start:
#   1. Copy .env.example to .env and add any API keys you need
#   2. Make sure Ollama is reachable (if using local models)
#   3. Run:  docker compose up -d
#
# Health check:  curl http://localhost:8788/health

services:
  wellagent-core:
    build: .
    ports:
      - "8788:8788"
    environment:
      # Ollama on the host — Docker reaches it via host.docker.internal
      - OLLAMA_HOST=host.docker.internal:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - WELLAGENT_HOST=0.0.0.0
      - WELLAGENT_PORT=8788
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wellagent-core-data:/app/data
      - wellagent-core-agentin:/app/agentin
    restart: unless-stopped

volumes:
  wellagent-core-data:
  wellagent-core-agentin:
